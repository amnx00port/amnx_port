[package]
name = "victory"
description = "Command-line front end: inspect, census, convert, run."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
victory-core.workspace = true
victory-pe.workspace = true
victory-loader.workspace = true
victory-hle.workspace = true
victory-shader = { workspace = true, features = ["host"] }
victory-game.workspace = true
anyhow.workspace = true
blake3.workspace = true
memchr.workspace = true
clap.workspace = true
walkdir.workspace = true

# The double-click menu: the console, the clipboard, the Windows build, the
# GPU's name and features.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Registry",
] }
windows = { workspace = true, features = [
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
] }

[dev-dependencies]
tempfile.workspace = true
toml.workspace = true

[features]
# Debug-level logs and the debugging switches (frame capture, stack dumps,
# the host debug layer, scripted keys). Off in a plain release build.
diagnostics = [
    "victory-core/diagnostics",
    "victory-hle/diagnostics",
    "victory-loader/diagnostics",
    "victory-shader/diagnostics",
]

[lints]
workspace = true
